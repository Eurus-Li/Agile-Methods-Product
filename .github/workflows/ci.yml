name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 现状：web/ 是零依赖的纯 JS/CSS/HTML，没有 TypeScript，也还没有独立的 ESLint 配置。
      # `npm run check` 目前做的是 `node --check`（语法校验）。等 ESLint 接入后拆成独立的
      # `lint` 步骤；皮肤纯逻辑通过下方独立 test 步骤验证。见 docs/architecture.md。
      - name: Check
        working-directory: web
        run: npm run check
      - name: Test pet skin logic
        working-directory: web
        run: npm test
      # TODO: ios/ 的 Xcode 工程建立后，这里加一个 macos-latest job：
      #   swift build && swiftlint && swift test（对应 docs/architecture.md 的 iOS 技术栈章节）

  plus-standalone:
    name: prototypes/plus-standalone (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        working-directory: prototypes/plus-standalone
        run: npm test
