name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pip:
    name: Pip (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 现状：Pip 是零依赖的纯 JS/CSS/HTML，没有 TypeScript，也还没有独立的 ESLint 配置。
      # `npm run check` 目前做的是 `node --check`（语法校验）。等 ESLint 接入后拆成独立的
      # `lint` 步骤；等 src/js 补上单元测试后加一个独立的 `test` 步骤。见 Pip/docs/architecture.md。
      - name: Check
        working-directory: Pip/web
        run: npm run check
      # TODO: Pip/ios/ 的 Xcode 工程建立后，这里加一个 macos-latest job：
      #   swift build && swiftlint && swift test（对应 Pip/docs/architecture.md 的 iOS 技术栈章节）

  rongrong-plus:
    name: RongrongPlus (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        working-directory: RongrongPlus
        run: npm test
