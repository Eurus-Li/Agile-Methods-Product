name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Current state: web/ is zero-dependency plain JS/CSS/HTML, with no TypeScript and no ESLint config yet.
      # `npm run check` currently runs `node --check` (syntax validation). Once ESLint is added, split it
      # into a separate `lint` step; pure skin logic is verified by the separate test step below. See docs/architecture.md.
      - name: Check
        working-directory: web
        run: npm run check
      - name: Test activity and pet skin logic
        working-directory: web
        run: npm test
      # TODO: once the ios/ Xcode project exists, add a macos-latest job here:
      #   swift build && swiftlint && swift test (see the iOS tech stack section of docs/architecture.md)

  plus-standalone:
    name: prototypes/plus-standalone (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        working-directory: prototypes/plus-standalone
        run: npm test
